# Audio Flamingo 3 LALM row (GPU cluster). Audio-only, text-only output.
# Run on the cluster: python -m src.pipeline.run_inference --config configs/af3.yaml --out results/af3_eval.json
#
# AF3 is transformers-native and runs in the SAME env as the Qwen row ($WORK/envs/qwen,
# transformers 5.13). Greedy decode (num_beams 1), matching Qwen; recorded in the manifest.

seed: 42

model:
  name: af3
  init:
    model_id: nvidia/audio-flamingo-3-hf
    device: cuda
    num_beams: 1
    max_new_tokens: 64
    caption_prompt: "Describe the audio in one short, factual sentence."

data:
  root: data/clotho_v2.1
  split: evaluation

audio:
  sample_rate: 44100
  note: "AF3 encoder is 16 kHz (128 mel); the wrapper resamples 44.1 kHz -> 16 kHz"
